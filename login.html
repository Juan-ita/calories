<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/beb9c9acc8.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gradient-to-br from-sky-200 to-emerald-100 h-screen">
    <section class="bg-white max-w-md mx-auto mt-25 rounded-xl p-6 shadow-md">
        <div class="font-bold text-5xl">
            <h1>Start your tracking today!</h1>
        </div>
        <form id="login-form">
            <id class="mt-15">
            <label id="email" for="name" class="font-bold">Email</label>
            <input type="email" placeholder="...@gmail.com" required
                      class="border border-gray-200 rounded-lg px-4 w-full mt-2 py-3"><br><br>

            <label id="password" for="password" class="font-bold">Password</label>
            <input type="password" placeholder="********" required
                    class="border border-gray-200 rounded-lg px-4 w-full py-3">
        </id>         
                <button class="bg-black text-white w-full py-4 rounded-xl px-4 font-bold text-2xl mt-9 cursor-pointer hover:bg-gray-900">
                    Login</button>

        <p class="p-10 ml-20 text-gray-400">or continue with</p>
        <div class="text-6xl p-6 flex justify-between cursor-pointer ">
        <i class="fa-brands fa-google"></i>
         <i class="fa-brands fa-facebook"></i>
         <i class="fa-brands fa-apple"></i>
        </div>

        </form>    
    </section>
    <script src="login.js"></script>
</body>
</html>
