<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-amber-100 via-orange-100 to-rose-100">
    <section class="bg-white max-w-md mx-auto p-6 rounded-xl mt-8">
        <div>
          <h1 class="font-bold text-3xl text-emerald-400"> Start Your Tracking Today!</h1>
        </div>
        <div class="mt-9">
            <label for="name" class="font-bold">Enter your full name</label>
            <input type="text" placeholder="John" required
               class="w-full border border-gray-200 rounded-lg px-2 py-2 mt-2 ">

            <label for="age" class="font-bold">Enter your age</label>
            <input type="number" placeholder="0" required 
                 class="w-full  border border-gray-200 rounded-lg px-2 py-2 mt-2 ">

            <label for="gender" class="font-bold">Whats your gender</label>
            <select id="gender"type="text" required 
                  class="w-full  border border-gray-200 rounded-lg px-2 py-2 mt-2 ">>
                 <option value="" disabled selected>Whats your age</option> 
                 <option value="female">Female</option> 
                 <option value="male">Male</option> 
            </select> 

            <label for="height" class="font-bold">Height</label>
            <input placeholder="...cm" required 
                    class="w-full  border border-gray-200 rounded-lg px-2 py-2 mt-2 ">
                 
            
            <label for="email" class="font-bold">Email</label>
            <input type="text" placeholder="@gmail.com" required
                     class="w-full  border border-gray-200 rounded-lg px-2 py-2 mt-2 ">

            <label for="weight" class="font-bold">Weight</label>         
            <input type="number" required  placeholder="..kg"
                    class="w-full  border border-gray-200 rounded-lg px-2 py-2 mt-2 ">

            <label for="fitness goal" class="font-bold">Your goal</label>        
            <select id="fitness-goal" required class="w-full  border border-gray-200 rounded-lg px-2 py-2 mt-2 ">
                <option value="" disabled selected>What is your primary goal?</option>
                <option value="Lose">Lose waight</option>
                <option value="Maintain">Maintain weight</option>
                <option value="Gain">Gain weight</option>
                
            </select>

            <label for="activity" class="font-bold">Activity level</label>
            <select id="activity-lavel" class="w-full  border border-gray-200 rounded-lg px-2 py-2 mt-2 ">
                <option value="" disabled selected>Select your daily activity</option>
                <option value="sedentary">Sedementary(Little or no exercise)</option>
                <option value="light">Lightl Active (Exercise 1-3 days/week)y</option>
                <option value="moderate">Moderately(Exercise 3-3 days/week)</option>
                <option value="active">Very Active(Hard exercise 6-7 days/weeks)</option>
            </select>
        </div>
        
         <a href="calories.html">
              <button class="bg-emerald-600 w-full text-white mt-9 py-5 hover:bg-emerald-400 cursor-pointer text-lg font-bold rounded-lg">
                     Start </button>
         </a>
       
    </section>
</body>
</html>
